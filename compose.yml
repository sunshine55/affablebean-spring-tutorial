services:
  afbb-db:
    image: mongo:8
    container_name: afbb-db
    ports:
      - 27017:27017
    volumes:
      - ./afbb-db/mongo:/docker-entrypoint-initdb.d
    networks:
      - afbb-network
  afbb-ws:
    image: ghcr.io/graalvm/graalvm-community:21
    container_name: afbb-ws
    ports:
      - "8080:8080"
    volumes:
      - ./afbb-ws:/workspace:delegate
    command: tail -f /dev/null
    networks:
      - afbb-network
  afbb-gui:
    image: node:22-bookworm
    container_name: afbb-gui
    ports:
      - 3000:3000
      - 3001:3001
    volumes:
      - ./afbb-gui:/workspace:delegated
    command: tail -f /dev/null
    networks:
      - afbb-network

networks:
  afbb-network:
    name: afbb-ms-nw